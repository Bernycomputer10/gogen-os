; GoGEN OS — firmware pro sekundární okruh GoGEN V2 (ESP32-C3 Super Mini)
;
; Dvě varianty zapojení ovládání:
;   gogen_pcf  – 5tlačítkový ovladač přes PCF8574 (0x20) + OLED na I2C (doporučeno)
;   gogen_gpio – tlačítka Světla/L/P přímo na GPIO2/20/21
;
; Build:   pio run -e gogen_pcf
; Nahrání: pio run -e gogen_pcf -t upload
; Konzole: pio device monitor

[platformio]
default_envs = gogen_pcf

[env]
platform = espressif32@6.9.0          ; Arduino core 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
build_flags =
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

[env:gogen_pcf]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGOGEN_INPUT_MODE=1

[env:gogen_gpio]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGOGEN_INPUT_MODE=0
