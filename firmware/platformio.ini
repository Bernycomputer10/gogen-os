; GoGEN OS 3 — firmware pro sekundární okruh GoGEN V2 (ESP-WROOM-32 / ESP32 DevKit)
;
; Dvě varianty zapojení ovládání:
;   gogen_pcf  – 5tlačítkový ovladač přes PCF8574 (0x20) + OLED na I2C (doporučeno,
;                jen tahle varianta má rychloměr a přední pohon)
;   gogen_gpio – tlačítka Světla/L/P/Mód přímo na GPIO4/18/19/14
;
; Build:   pio run -e gogen_pcf
; Nahrání: pio run -e gogen_pcf -t upload   (při "Connecting..." podrž BOOT)
; Konzole: pio device monitor               (USB-UART převodník CP2102/CH340 na desce)
; Testy logiky na PC: viz tools/host_tests

[platformio]
default_envs = gogen_pcf

[env]
platform = espressif32@6.9.0          ; Arduino core 2.0.17
board = esp32dev                      ; ESP-WROOM-32, 4 MB flash
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = min_spiffs.csv   ; 2 × 1,9 MB → OTA přes Wi-Fi
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.11
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

[env:gogen_pcf]
build_flags =
    ${env.build_flags}
    -DGOGEN_INPUT_MODE=1

[env:gogen_gpio]
build_flags =
    ${env.build_flags}
    -DGOGEN_INPUT_MODE=0
